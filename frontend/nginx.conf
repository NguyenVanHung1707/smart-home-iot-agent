# Map Cloudflare Connecting IP if present, otherwise remote address
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $client_real_ip zone=api_limit:10m rate=30r/s;
limit_req_zone $client_real_ip zone=auth_limit:10m rate=10r/s;
limit_conn_zone $client_real_ip zone=addr:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name lophocso.io.vn www.lophocso.io.vn localhost _;

    client_max_body_size 25M;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Security Headers for Production & Public Access
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Auth API routes (Strict rate limiting against brute force)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn addr 10;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API routes
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr 30;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Health check endpoint
    location /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }



    # MQTT over WebSocket (WSS on domain)
    location /mqtt {
        set $mqtt_upstream http://mqtt:9001;
        proxy_pass $mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Xiaozhi ESP32 Voice Server - HTTP OTA & Vision API
    location /xiaozhi/ota/ {
        set $xiaozhi_http_upstream http://xiaozhi-server:8003;
        proxy_pass $xiaozhi_http_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Xiaozhi Audio Stream (Music & TTS WAV for Web & Loa ESP32)
    location /xiaozhi/audio/ {
        set $xiaozhi_http_upstream http://xiaozhi-server:8003;
        proxy_pass $xiaozhi_http_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Xiaozhi ESP32 Voice Server - WebSocket Voice Stream
    location /xiaozhi/v1/ {
        set $xiaozhi_ws_upstream http://xiaozhi-server:8000;
        proxy_pass $xiaozhi_ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static frontend files (SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
