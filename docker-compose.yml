services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://homing_user:homing_password@postgres:5432/homing_db
      MQTT_BROKER: mqtt
      MQTT_ENABLED: "true"
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_LOCAL_ONLY: ${LLM_LOCAL_ONLY:-true}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://192.168.1.16:8080/v1}
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      ZIPFORMER_ENDPOINT: ${ZIPFORMER_ENDPOINT:-http://192.168.1.16:8090/v1/audio/transcriptions}
      ZIPFORMER_HEALTH_ENDPOINT: ${ZIPFORMER_HEALTH_ENDPOINT:-http://192.168.1.16:8090/health}
      ZIPFORMER_MODEL_DIR: ${ZIPFORMER_MODEL_DIR:-/models/zipformer/sherpa-onnx-zipformer-vi-int8-2025-04-20}
      ZIPFORMER_NUM_THREADS: ${ZIPFORMER_NUM_THREADS:-2}
      PIPER_ENDPOINT: ${PIPER_ENDPOINT:-http://192.168.1.16:8091}
      PIPER_VOICE: ${PIPER_VOICE:-vi_VN-vais1000-medium}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-30}
      VOICE_MAX_AUDIO_SECONDS: ${VOICE_MAX_AUDIO_SECONDS:-20}
      VOICE_MAX_AUDIO_BYTES: ${VOICE_MAX_AUDIO_BYTES:-1000000}
      VOICE_MAX_TTS_CHARS: ${VOICE_MAX_TTS_CHARS:-1000}
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./src:/app/src
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    # Cổng 1883 (TCP) mở ra mạng LAN để kết nối với ESP32 qua WiFi
    # Cổng 9001 (WebSocket) cho Web Dashboard / Reverse proxy
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:9001:9001"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  device-simulator:
    build: .
    command: ["python", "-m", "src.simulator"]
    ports: ["8001:8001"]
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: homing
      DEVICE_STORAGE_PATH: runtime/devices.json
      SIMULATOR_HOST: "0.0.0.0"
      SIMULATOR_PORT: "8001"
    volumes:
      - ./runtime:/app/runtime
      - ./frontend-simulator/dist:/app/frontend-simulator/dist:ro
      - ./src:/app/src
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # [DEPRECATED / REMOVED] Các model cục bộ (llama.cpp, piper, zipformer)
  # đã được loại bỏ hoàn toàn để chuyển sang kiến trúc Cloud AI (Xiaozhi Cloud / Gemini / Groq).

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: homing_user
      POSTGRES_PASSWORD: homing_password
      POSTGRES_DB: homing_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homing_user -d homing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel for domain lophocso.io.vn (HTTPS & secure remote access)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel", "cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  mqtt-data:
  postgres-data:
