services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://homing_user:homing_password@postgres:5432/homing_db
      MQTT_BROKER: mqtt
      MQTT_ENABLED: "true"
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_LOCAL_ONLY: ${LLM_LOCAL_ONLY:-true}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://ollama:11434/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./src:/app/src
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    # Cổng 1883 (TCP) mở ra mạng LAN để kết nối với ESP32 qua WiFi
    # Cổng 9001 (WebSocket) cho Web Dashboard / Reverse proxy
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:9001:9001"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: homing-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Tự động tải mô hình Qwen 2.5 7B vào GPU ngay khi khởi động hoặc clone mới dự án
  ollama-init:
    image: ollama/ollama:latest
    container_name: homing-ollama-init
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; if ! ollama list | grep -q 'qwen2.5:7b'; then echo 'Pulling qwen2.5:7b...'; ollama pull qwen2.5:7b; fi; echo 'qwen2.5:7b is ready!'"]
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: homing_user
      POSTGRES_PASSWORD: homing_password
      POSTGRES_DB: homing_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homing_user -d homing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel for domain lophocso.io.vn (HTTPS & secure remote access)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

  # Máy chủ AI Xiaozhi ESP32 Voice Server (Tự host cục bộ)
  xiaozhi-server:
    build:
      context: ./infra/xiaozhi
      dockerfile: Dockerfile
    image: homing-xiaozhi-server:latest
    container_name: homing-xiaozhi-server
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - LD_LIBRARY_PATH=/usr/local/lib/python3.10/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.10/site-packages/nvidia/cudnn/lib
    ports:
      # Port 8090 (host) -> 8000 (WebSocket audio server cho ESP32)
      - "8090:8000"
      # Port 8093 (host) -> 8003 (HTTP OTA & Vision API)
      - "8093:8003"
    volumes:
      - ./infra/xiaozhi/data:/opt/xiaozhi-esp32-server/data
      - ./infra/xiaozhi/plugins/smart_home.py:/opt/xiaozhi-esp32-server/plugins_func/functions/smart_home.py:ro
      - ./infra/xiaozhi/models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      - ./infra/xiaozhi/http_server.py:/opt/xiaozhi-esp32-server/core/http_server.py:ro
      - ./infra/xiaozhi/fun_local.py:/opt/xiaozhi-esp32-server/core/providers/asr/fun_local.py:ro
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      backend:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  mqtt-data:
  postgres-data:
  ollama-data:
  hf-cache:
