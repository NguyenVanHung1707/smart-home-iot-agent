# Mosquitto Broker with Authentication & Access Control (ACL) for Homing Hub

# Local LAN TCP MQTT for ESP32 devices (Port 1883)
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/pwfile
acl_file /mosquitto/config/aclfile

# WebSocket listener for Web Dashboard & Cloudflare Reverse Proxy (Port 9001)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
