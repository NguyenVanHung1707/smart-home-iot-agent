name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not live_model and not hardware"
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          LLM_ENABLED: "false"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-simulator/package-lock.json

      - name: Build and typecheck frontends
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
          npm --prefix frontend-simulator install
          npm --prefix frontend-simulator run build
