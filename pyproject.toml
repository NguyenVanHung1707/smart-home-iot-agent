[project]
name = "vinai20k-p-140"
version = "0.1.0"
description = "AI20K Agent"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DMHT"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.10.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "paho-mqtt>=2.1.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sherpa-onnx==1.13.4",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
]
vector = [
    "chromadb>=0.5.0",
]

dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["home-llm-0.4.10"]
markers = [
    "live_model: tests that require a running LLM server or real model inference",
    "hardware: tests that require physical hardware or external devices",
]
